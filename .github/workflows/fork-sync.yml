# Keep the fork's next in sync with upstream and publish every checked next commit as a release.
# This workflow is the only pusher of next and main. It runs daily, on every push to an owning branch, and on
# demand: Actions tab -> "Sync fork and release next" -> Run workflow, or gh workflow run fork-sync.yml.
# install-next.sh installs the newest release; nothing else builds or checks on the machines that run pi.
name: Sync fork and release next

on:
  schedule:
    - cron: "23 7 * * *"
  # Only workflows present on the pushed branch run, and only fork/tooling carries this file. A push to
  # feat/** or fix/** does not start it: dispatch it by hand (gh workflow run fork-sync.yml --repo JangMan-J/pi).
  push:
    branches: [fork/tooling]
  workflow_dispatch:
    inputs:
      push:
        description: Push the synced branches and next, and publish the release (uncheck for a dry run)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync-and-release:
    # The sync's own pushes of rebased branches come through the deploy key and would start another run;
    # their head commit carries the sync's committer identity (set below).
    if: github.event_name != 'push' || github.event.head_commit.committer.name != 'JangMan-J (fork-sync)'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # In a fork checkout gh defaults to the parent repository; releases belong to this one.
      GH_REPO: ${{ github.repository }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
    steps:
      - name: Checkout next with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          fetch-depth: 0
          # git pushes go through a write deploy key: GITHUB_TOKEN may not push commits that change
          # .github/workflows/, and both upstream's main and fork/tooling's merge into next do.
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Identity and signing key
        env:
          GPG_KEY: ${{ secrets.FORK_SYNC_GPG_KEY }}
        run: |
          printf '%s\n' "$GPG_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          git config user.name "JangMan-J (fork-sync)"
          git config user.email "278475828+JangMan-J@users.noreply.github.com"
          git config user.signingkey "$fpr"
          git config commit.gpgsign true
          git config tag.gpgsign true
          echo "signing with $fpr"

      - name: Create local branches
        run: |
          git remote add upstream https://github.com/earendil-works/pi.git
          .fork/sync.sh --align

      - name: Sync with upstream
        # sync.sh rebuilds next and runs the focused checks only when upstream or a branch moved. A branch
        # that does not rebase onto the new upstream holds main back (a warning names it) instead of failing.
        run: |
          if [ "$PUBLISH" = "true" ]; then .fork/sync.sh --hold-on-conflict --push; else echo "dry run: no push"; .fork/sync.sh --hold-on-conflict; fi

      - name: Decide whether next needs a release
        id: release
        run: |
          git checkout -q next
          commit="$(git rev-parse HEAD)"
          tag="next-${commit:0:12}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail manual sync when upstream is held back with nothing to release
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.needed == 'false'
        run: |
          behind="$(git rev-list --count main..upstream/main)"
          if [ "$behind" -gt 0 ]; then
            echo "Upstream sync held back ($behind upstream commit(s) unmerged due to rebase conflict) and next has no new release to publish." >&2
            exit 1
          fi

      - name: Require next to be exactly the merge of the branches
        # The release gate for every pusher: no commits on next outside the branches in .fork/branches,
        # every branch on main, and main a mirror of upstream.
        if: steps.release.outputs.needed == 'true'
        run: .fork/sync.sh --status

      - name: Build
        # sync.sh already prepared the workspace when it rebuilt next; these guards cover a run that did not.
        if: steps.release.outputs.needed == 'true'
        run: |
          [ -d node_modules ] || npm ci --ignore-scripts
          node .fork/catalog-snapshot.mjs hydrate
          npm run build:offline

      - name: Check
        if: steps.release.outputs.needed == 'true'
        run: |
          npm run check
          git diff --exit-code || { echo "npm run check changed files; fix them on their owning branch"; exit 1; }
          .fork/check.sh focused

      - name: Pack
        if: steps.release.outputs.needed == 'true'
        run: .fork/pack-release.sh "$RUNNER_TEMP/release"

      - name: Publish
        if: steps.release.outputs.needed == 'true' && env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          {
            echo "next at $COMMIT, checked and packed by the fork workflow. Install it with .fork/install-next.sh."
            echo
            echo "Branches merged into next:"
            grep -vE '^\s*(#|$)' .fork/branches | sed 's/^/- /'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP"/release/pi-next.tar.gz "$RUNNER_TEMP"/release/pi-next.tar.gz.sha256 \
            "$RUNNER_TEMP"/release/release.json --target "$COMMIT" --title "next ${COMMIT:0:9}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # Keep the five newest next releases; install-next.sh keeps its own previous copy for rollback.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("next-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

      - name: Status
        # A failed step can leave a rebase or merge in progress on a branch without .fork/; fork/tooling has it,
        # and --status reads refs, not the checkout.
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git checkout -qf fork/tooling 2>/dev/null || git checkout -qf next
          .fork/sync.sh --status || true
