<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" role="img" aria-label="Long answers and large files">
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}</style>
<text x="20" y="28" font-size="18" font-weight="600" fill="#ffffff">Long answers and large files</text>
<text x="20" y="50" font-size="13" fill="#c3c2b7">Answers streamed at 1,200 characters a second; a file written through a tool call. Lower is better.</text>
