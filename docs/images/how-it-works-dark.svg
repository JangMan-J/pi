<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="How Pi-Bolt is built: Pi is bundled to bytecode, compiled ahead of time to x86-64 machine code with a prebuilt heap, and stored in one executable that maps them at launch">
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<text x="20" y="22" font-size="11.5" font-weight="700" letter-spacing="1" fill="#9198a1">BUILD TIME</text>
<text x="712" y="22" font-size="11.5" font-weight="700" letter-spacing="1" fill="#9198a1">LAUNCH</text>
<rect x="20" y="36" width="128" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="34" y="62" font-size="14" font-weight="700" fill="#e6edf3">Pi 1.0.0</text>
<text x="34" y="84" font-size="12" fill="#9198a1">TypeScript,</text>
<text x="34" y="102" font-size="12" fill="#9198a1">unmodified</text>
<line x1="148" y1="82" x2="170" y2="82" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
<rect x="172" y="36" width="150" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="186" y="62" font-size="14" font-weight="700" fill="#e6edf3">bun build</text>
<text x="186" y="84" font-size="12" fill="#9198a1">bundled, compiled</text>
<text x="186" y="102" font-size="12" fill="#9198a1">to bytecode</text>
<line x1="322" y1="82" x2="344" y2="82" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
<rect x="346" y="36" width="184" height="92" rx="10" fill="#161b22" stroke="#3987E5" stroke-width="2"/>
<text x="360" y="62" font-size="14" font-weight="700" fill="#e6edf3">AOT compiler</text>
<text x="360" y="84" font-size="12" fill="#9198a1">every function to</text>
<text x="360" y="102" font-size="12" fill="#9198a1">x86-64 machine code</text>
<rect x="346" y="148" width="184" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="360" y="174" font-size="14" font-weight="700" fill="#e6edf3">Training profile</text>
<text x="360" y="196" font-size="12" fill="#9198a1">function order,</text>
<text x="360" y="214" font-size="12" fill="#9198a1">regular expressions</text>
<line x1="438" y1="148" x2="438" y2="130" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="82" x2="554" y2="82" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
<rect x="556" y="36" width="134" height="194" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="623.0" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#e6edf3">one executable</text>
<rect x="568" y="74" width="110" height="42" rx="6" fill="#30363d"/>
<text x="623.0" y="100" font-size="12" font-weight="600" text-anchor="middle" fill="#e6edf3">Bun runtime</text>
<rect x="568" y="124" width="110" height="42" rx="6" fill="#F0B03A"/>
<text x="623.0" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">prebuilt heap</text>
<rect x="568" y="174" width="110" height="42" rx="6" fill="#3987E5"/>
<text x="623.0" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">machine code</text>
<line x1="690" y1="133" x2="710" y2="133" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
<rect x="712" y="36" width="148" height="194" rx="10" fill="#161b22" stroke="#F0B03A" stroke-width="2"/>
<text x="726" y="62" font-size="14" font-weight="700" fill="#e6edf3">pi</text>
<text x="726" y="84" font-size="12" fill="#9198a1">maps code and</text>
<text x="726" y="102" font-size="12" fill="#9198a1">heap from the file,</text>
<text x="726" y="120" font-size="12" fill="#9198a1">runs main()</text>
<text x="726" y="138" font-size="12" fill="#9198a1"></text>
<text x="726" y="156" font-size="12" fill="#9198a1">nothing parsed,</text>
<text x="726" y="174" font-size="12" fill="#9198a1">interpreted or</text>
<text x="726" y="192" font-size="12" fill="#9198a1">JIT-compiled</text>
</svg>
